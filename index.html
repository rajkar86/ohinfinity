<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oh Infinity</title><style>
:root{--bg:#fafafa;--fg:#1c1b1f;--muted:#5f5e66;--line:#d6d5dc;--accent:#8a6d00}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#e6e1e5;--muted:#a9a6b0;--line:#3a3940;--accent:#e2c35a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 16px 64px}h1{font-size:1.7rem;line-height:1.25;margin:0 0 4px}
h2{font-size:1.15rem;margin:32px 0 8px}p,li{color:var(--fg)}.muted{color:var(--muted)}a{color:var(--accent)}
nav{font-size:.95rem;margin-bottom:24px}nav a{text-decoration:none}footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
ul,ol{padding-left:1.3em}.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
</style></head>
<body><main><h1>Oh Infinity</h1>
<p class="muted">Small word games for iPhone and Android.</p>
<div class="card"><h2 style="margin-top:0">Spelling Bee Unlimited</h2>
<p>Make words from seven letters. Every word uses the center letter.</p>
<p><a href="spelling-bee/support/">Support</a> &middot; <a href="spelling-bee/privacy/">Privacy policy</a></p></div>
<footer>&copy; 2026 Oh Infinity</footer></main></body></html>
